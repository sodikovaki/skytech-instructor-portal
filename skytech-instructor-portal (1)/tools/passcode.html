<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Change passcode</title>
<style>
  body { font: 17px/1.5 system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #17202E; }
  input, button { font: inherit; padding: 10px; }
  input { width: 100%; box-sizing: border-box; }
  code { display: block; word-break: break-all; background: #EEF1F5; padding: 12px; margin-top: 12px; }
</style>
</head>
<body>
  <h1>Change the instructor passcode</h1>
  <p>Type the new passcode. Copy the code that appears and paste it into <b>app.js</b> as the value of <b>PASSCODE_HASH</b>, then commit.</p>
  <input id="p" type="text" placeholder="New passcode" aria-label="New passcode">
  <code id="out">Code appears here</code>
  <script>
    document.getElementById("p").addEventListener("input", async (e) => {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(e.target.value.trim()));
      document.getElementById("out").textContent = e.target.value.trim()
        ? [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("")
        : "Code appears here";
    });
  </script>
</body>
</html>
